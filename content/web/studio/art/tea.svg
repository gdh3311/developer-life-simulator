<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 200 160">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#3a4a7a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3a4a7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="saucer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#cfd3d9"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9dde3"/>
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#eef0f3"/>
      <stop offset="1" stop-color="#b9bfc8"/>
    </linearGradient>
    <radialGradient id="tea" cx="0.45" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#d7e98f"/>
      <stop offset="0.6" stop-color="#9fbf4f"/>
      <stop offset="1" stop-color="#6f8f2f"/>
    </radialGradient>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="petal" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffe3ee"/>
      <stop offset="1" stop-color="#f38fb4"/>
    </radialGradient>
  </defs>
  <ellipse cx="100" cy="92" rx="88" ry="62" fill="url(#bg)"/>
  <!-- steam -->
  <path d="M86 58 C78 46 92 40 84 28 C80 22 86 16 84 10" fill="none" stroke="url(#steam)" stroke-width="5" stroke-linecap="round"/>
  <path d="M106 56 C98 44 112 38 104 26 C100 20 106 14 104 8" fill="none" stroke="url(#steam)" stroke-width="4" stroke-linecap="round"/>
  <!-- saucer -->
  <ellipse cx="100" cy="132" rx="70" ry="14" fill="#000" opacity="0.25"/>
  <ellipse cx="100" cy="126" rx="70" ry="15" fill="url(#saucer)"/>
  <ellipse cx="100" cy="124" rx="48" ry="8" fill="#e3e6ea"/>
  <!-- handle -->
  <path d="M142 80 C164 78 166 108 140 110" fill="none" stroke="#c9ced6" stroke-width="10" stroke-linecap="round"/>
  <path d="M142 80 C160 79 162 106 140 108" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- cup body -->
  <path d="M54 66 L146 66 C146 100 132 124 100 124 C68 124 54 100 54 66 Z" fill="url(#cup)"/>
  <path d="M64 74 C66 98 76 114 92 118" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <!-- rim and tea -->
  <ellipse cx="100" cy="66" rx="46" ry="11" fill="#e8ebef"/>
  <ellipse cx="100" cy="67" rx="41" ry="8.5" fill="url(#tea)"/>
  <ellipse cx="88" cy="64" rx="14" ry="2.5" fill="#ffffff" opacity="0.35"/>
  <!-- floating petals -->
  <path d="M110 66 c4 -6 12 -6 12 0 c0 5 -8 7 -12 0 Z" fill="url(#petal)"/>
  <path d="M84 69 c3 -4 9 -4 9 0 c0 4 -6 5 -9 0 Z" fill="url(#petal)"/>
  <!-- blossom by the saucer -->
  <g transform="translate(160 118)">
    <circle cx="0" cy="-7" r="6" fill="url(#petal)"/>
    <circle cx="7" cy="-2" r="6" fill="url(#petal)"/>
    <circle cx="4" cy="6" r="6" fill="url(#petal)"/>
    <circle cx="-4" cy="6" r="6" fill="url(#petal)"/>
    <circle cx="-7" cy="-2" r="6" fill="url(#petal)"/>
    <circle cx="0" cy="0" r="3" fill="#f6c453"/>
  </g>
</svg>
