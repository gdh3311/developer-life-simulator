    <radialGradient id="flame" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#ffe38a"/>
      <stop offset="1" stop-color="#ff8a2a"/>
    </radialGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b3566"/>
      <stop offset="1" stop-color="#3d4a86"/>
    </linearGradient>
  </defs>
  <ellipse cx="100" cy="60" rx="80" ry="58" fill="url(#glow)"/>
  <ellipse cx="100" cy="140" rx="50" ry="8" fill="#000" opacity="0.3"/>
