  <!-- wick and flame -->
  <path d="M100 64 L100 54" stroke="#2a2420" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M100 22 C110 36 112 46 100 56 C88 46 90 36 100 22 Z" fill="url(#flame)"/>
  <path d="M100 38 C104 44 104 50 100 54 C96 50 96 44 100 38 Z" fill="#ffffff" opacity="0.8"/>
