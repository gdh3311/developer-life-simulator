<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 200 160">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#ffcf6b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffcf6b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fb3c8" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#e8f1fa" stop-opacity="0.75"/>
      <stop offset="0.7" stop-color="#c6d4e2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7f93a8" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="wax" x1="0" y1="0" x2="0" y2="1">
