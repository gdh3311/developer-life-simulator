  <path d="M56 96 L144 96 L144 118 L56 118 Z" fill="url(#label)" opacity="0.92"/>
  <path d="M94 100 a7 7 0 1 0 0 14 a5.5 5.5 0 1 1 0 -14 Z" fill="#f4c95d"/>
  <rect x="106" y="104" width="24" height="2.5" rx="1" fill="#c9cfee"/>
  <rect x="106" y="109" width="16" height="2.5" rx="1" fill="#8f99cc"/>
