  <ellipse cx="100" cy="52" rx="44" ry="9" fill="none" stroke="#e8f1fa" stroke-width="2.5" opacity="0.8"/>
  <path d="M64 60 L66 132" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
