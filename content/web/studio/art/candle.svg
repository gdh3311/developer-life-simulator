  <path d="M60 64 L140 64 L140 132 C140 138 124 141 100 141 C76 141 60 138 60 132 Z" fill="url(#wax)"/>
  <ellipse cx="100" cy="64" rx="40" ry="8" fill="#fffcf2"/>
