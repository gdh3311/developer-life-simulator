<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 200 160">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#3a4a7a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3a4a7a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d0d9"/>
    </linearGradient>
    <radialGradient id="dough" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#f6d79a"/>
      <stop offset="0.55" stop-color="#dca85c"/>
      <stop offset="1" stop-color="#a86d2c"/>
    </radialGradient>
    <radialGradient id="chip" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#7a4a2a"/>
      <stop offset="1" stop-color="#2e1a0e"/>
    </radialGradient>
  </defs>
  <ellipse cx="100" cy="92" rx="88" ry="62" fill="url(#bg)"/>
  <ellipse cx="100" cy="136" rx="78" ry="13" fill="#000" opacity="0.25"/>
  <ellipse cx="100" cy="128" rx="78" ry="16" fill="url(#plate)"/>
  <ellipse cx="100" cy="126" rx="58" ry="9" fill="#e4e8ee"/>
  <!-- back cookie, leaning -->
  <g transform="rotate(-14 128 82)">
    <ellipse cx="128" cy="82" rx="34" ry="32" fill="url(#dough)"/>
    <ellipse cx="128" cy="82" rx="34" ry="32" fill="none" stroke="#9a6326" stroke-width="2" opacity="0.5"/>
    <ellipse cx="118" cy="72" rx="5" ry="4" fill="url(#chip)"/>
    <ellipse cx="138" cy="90" rx="6" ry="4.5" fill="url(#chip)"/>
    <ellipse cx="124" cy="98" rx="4" ry="3" fill="url(#chip)"/>
    <ellipse cx="142" cy="70" rx="3.5" ry="3" fill="url(#chip)"/>
  </g>
  <!-- stacked front cookies -->
  <ellipse cx="82" cy="118" rx="40" ry="11" fill="#a86d2c"/>
  <ellipse cx="82" cy="112" rx="40" ry="11" fill="url(#dough)"/>
  <ellipse cx="82" cy="106" rx="40" ry="11" fill="#b47a35"/>
  <ellipse cx="82" cy="100" rx="40" ry="11" fill="url(#dough)"/>
  <ellipse cx="70" cy="98" rx="5" ry="2.6" fill="url(#chip)"/>
  <ellipse cx="92" cy="102" rx="6" ry="2.8" fill="url(#chip)"/>
  <ellipse cx="84" cy="95" rx="3.5" ry="2" fill="url(#chip)"/>
  <ellipse cx="102" cy="97" rx="3" ry="1.8" fill="url(#chip)"/>
  <path d="M50 98 C58 92 72 90 84 90" fill="none" stroke="#fff1cf" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- crumbs -->
  <circle cx="132" cy="124" r="2.2" fill="#c99247"/>
  <circle cx="140" cy="128" r="1.5" fill="#c99247"/>
  <circle cx="48" cy="126" r="1.8" fill="#c99247"/>
</svg>
